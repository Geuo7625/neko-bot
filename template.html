    <script>
      let markdownRenderer = null;
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
      window.initializeRenderer = function () {
        if (typeof window.markdownit !== "function") {
          throw new Error("markdown-it 未加载");
        }
        markdownRenderer = window.markdownit({
          html: true,
          breaks: true,
          linkify: true,
          typographer: true,
          highlight: (str, lang) => {
            if (window.hljs && lang && hljs.getLanguage(lang)) {
              try {
                return hljs.highlight(str, { language: lang }).value;
              } catch {}
            }
            return "";
          },
        });
        const defaultFence =
          markdownRenderer.renderer.rules.fence ||
          ((tokens, idx, options, env, self) =>
            self.renderToken(tokens, idx, options));
        markdownRenderer.renderer.rules.fence = (
          tokens,
          idx,
          options,
          env,
          self,
        ) => {
          const token = tokens[idx];
          const info = token.info
            ? token.info.trim().split(/\s+/)[0].toLowerCase()
            : "";
          if (info === "mermaid") {
            return `<div class="mermaid-container"><div class="mermaid">${escapeHtml(token.content)}</div></div>`;
          }
          return defaultFence(tokens, idx, options, env, self);
        };
        if (window.mermaid) {
          window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: "loose",
            theme: "default",
            flowchart: { useMaxWidth: false },
            sequence: { useMaxWidth: false },
            gantt: { useMaxWidth: false },
          });
        }
      };
      function renderKatex(source) {
        if (
          !window.katex ||
          typeof window.katex.renderToString !== "function"
        ) {
          return source;
        }
        const placeholders = [];
        let text = String(source || "").replace(/```[\s\S]*?```/g, (match) => {
          const index = placeholders.length;
          placeholders.push(match);
          return `\u0000CODE_${index}\u0000`;
        });
        const render = (formula, display, raw) => {
          try {
            return window.katex.renderToString(formula.trim(), {
              displayMode: display,
              throwOnError: false,
              strict: false,
            });
          } catch {
            return raw;
          }
        };
        text = text.replace(/\$\$([\s\S]*?)\$\$/g, (_, formula) =>
          render(formula, true, _),
        );
        text = text.replace(/\\\[([\s\S]*?)\\\]/g, (_, formula) =>
          render(formula, true, _),
        );
        text = text.replace(/\\\(([\s\S]*?)\\\)/g, (_, formula) =>
          render(formula, false, _),
        );
        text = text.replace(
          /(^|[^$])\$(?!\$)([^\n$]+?)\$(?!\$)/g,
          (_, prefix, formula) => prefix + render(formula, false, _),
        );
        return text.replace(
          /\u0000CODE_(\d+)\u0000/g,
          (_, index) => placeholders[Number(index)],
        );
      }
      window.renderMarkdown = async function (source) {
        if (!markdownRenderer) window.initializeRenderer();
        const content = document.getElementById("content");
        if (!content) {
          throw new Error("#content 不存在");
        }
        content.innerHTML = markdownRenderer.render(
          renderKatex(String(source || "")),
        );
      };
      window.renderMermaid = async function () {
        if (!window.mermaid) return;
        const nodes = document.querySelectorAll(".mermaid");
        let counter = 0;
        for (const node of nodes) {
          if (node.dataset.rendered === "true") continue;
          const source = node.textContent || "";
          const id = `mermaid-${Date.now()}-${counter++}`;
          try {
            const result = await window.mermaid.render(id, source);
            node.innerHTML = result.svg;
            node.dataset.rendered = "true";
            if (result.bindFunctions) {
              result.bindFunctions(node);
            }
          } catch (error) {
            console.error("Mermaid 渲染失败:", error);
            node.textContent = source;
            node.dataset.rendered = "error";
          }
        }
      };
    </script>
    <script type="module">
      window.pdfjsReady = (async () => {
        const pdfjsLib = await import("/pdfjs/pdf.min.mjs");
        window.pdfjsLib = pdfjsLib;
        if (pdfjsLib.GlobalWorkerOptions) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
        }
        return pdfjsLib;
      })();
    </script>
    <script type="module">
      let busyTexRunner = null;
      let xelatex = null;
      let busyTexPromise = null;
      function toBase64(bytes) {
        const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        let binary = "";
        const chunk = 0x8000;
        for (let i = 0; i < u8.length; i += chunk) {
          binary += String.fromCharCode(
            ...u8.subarray(i, Math.min(i + chunk, u8.length)),
          );
        }
        return btoa(binary);
      }
      async function ensureBusyTex() {
        if (busyTexRunner && xelatex) return xelatex;
        if (busyTexPromise) return busyTexPromise;
        busyTexPromise = (async () => {
          const cfg = window.__busyTexConfig || {};
          if (!cfg.moduleUrl) {
            throw new Error("缺少 BusyTeX moduleUrl");
          }
          if (!cfg.preloadDataPackages?.length) {
            throw new Error(
              "BusyTeX 未配置 texlive data package，请确认 texlive-basic.js 存在",
            );
          }
          console.log("[LaTeX] 初始化 BusyTeX...");
          const mod = await import(cfg.moduleUrl);
          const runner = new mod.BusyTexRunner({
            busytexBasePath: cfg.basePath || "/busytex",
            preloadDataPackages: cfg.preloadDataPackages || [],
            catalogDataPackages: cfg.catalogDataPackages || [],
            verbose: true,
            engineMode: "combined",
            // 临时测试
            remoteEndpoint: cfg.remoteEndpoint || undefined,
          });
          await runner.initialize(true);
          busyTexRunner = runner;
          xelatex = new mod.XeLatex(runner, true);
          console.log("[LaTeX] XeLaTeX 已就绪");
          return xelatex;
        })();
        try {
          return await busyTexPromise;
        } finally {
          busyTexPromise = null;
        }
      }
      async function loadBusyTexFile(name) {
        const response = await fetch(`/busytex/${name}`);
        if (!response.ok) {
          throw new Error(`BusyTeX 文件加载失败: ${name} (${response.status})`);
        }
        return new Uint8Array(await response.arrayBuffer());
      }
      window.compileLatex = async function (source) {
        const engine = await ensureBusyTex();
        const cfg = window.__busyTexConfig || {};
        const additionalFiles = [
          {
            path: "FandolSong-Regular.otf",
            content: await loadBusyTexFile("FandolSong-Regular.otf"),
          },
          {
            path: "FandolSong-Bold.otf",
            content: await loadBusyTexFile("FandolSong-Bold.otf"),
          },
          {
            path: "FandolHei-Regular.otf",
            content: await loadBusyTexFile("FandolHei-Regular.otf"),
          },
          {
            path: "FandolFang-Regular.otf",
            content: await loadBusyTexFile("FandolFang-Regular.otf"),
          },
        ];
        const result = await engine.compile({
          input: String(source || ""),
          mainTexPath: "main.tex",
          additionalFiles,
          rerun: true,
          verbose: "silent",
          remoteEndpoint: cfg.remoteEndpoint || undefined,
        });
        console.log("[LaTeX DEBUG] success =", result?.success);
        console.log("[LaTeX DEBUG] exitCode =", result?.exitCode);
        console.log("[LaTeX DEBUG] log =", result?.log);
        const logs = result?.logs || [];
        for (const item of logs) {
          const text = [
            item?.stdout,
            item?.stderr,
            item?.log,
            item?.texmflog,
            item?.missfontlog,
          ]
            .filter(Boolean)
            .join("\n");
          if (/font|Fandol|CJK|xeCJK|fatal|error|missing/i.test(text)) {
            console.log("[LaTeX FONT/ERROR]", text);
          }
        }
        if (result?.pdf) {
          result.pdf = toBase64(result.pdf);
        }
        return result;
      };
      window.addEventListener("beforeunload", () => {
        try {
          busyTexRunner?.terminate();
        } catch {}
      });
    </script>
